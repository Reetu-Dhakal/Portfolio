<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ritu Dhakal — Digital Scrapbook</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
<style>
*{*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f8f3e8;--paper-deep:#eee5d4;--paper-light:#fffdf7;
  --yellow:#f4d86d;--butter:#f8e9a8;--blue:#afcfe3;--powder:#719bb5;
  --sage:#9bae87;--green:#52664a;--coral:#c9795b;--ink:#25251f;
  --ink-soft:#4a4a42;--muted:#77756b;--line:rgba(37,37,31,0.18);
  --font-sans:"DM Sans","Segoe UI",sans-serif;--font-serif:"Playfair Display",Georgia,serif;
  --font-hand:"Caveat","Segoe Print",cursive;--font-mono:"DM Sans","Segoe UI",monospace;
}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden}
.scrapbook-page{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px 12px}
.scrapbook-page h1{font-family:var(--font-serif);font-size:1.6rem;font-weight:700;letter-spacing:-0.03em;color:var(--ink)}
.scrapbook-page h1 em{font-style:italic;color:var(--coral)}
.scrapbook-page .subtitle{font-family:var(--font-hand);font-size:1.1rem;color:var(--coral);transform:rotate(-1deg)}
.book-wrapper{position:relative;width:min(88vw,400px);max-width:400px;perspective:1500px;perspective-origin:50% 50%}
.book{position:relative;width:100%;aspect-ratio:4/3;transform-style:preserve-3d}
.spine{position:absolute;left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%);z-index:6;
  background:linear-gradient(90deg,#8b7355,#a0896c,#8b7355);border-radius:2px;
  box-shadow:inset -1px 0 2px rgba(0,0,0,0.3),inset 1px 0 2px rgba(0,0,0,0.3)}
.spine-shadow-left{position:absolute;left:50%;top:0;bottom:0;width:28px;transform:translateX(-50%);z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0.1) 0%,transparent 100%)}
.spine-shadow-right{position:absolute;left:50%;top:0;bottom:0;width:28px;transform:translateX(-50%);z-index:1;pointer-events:none;
  background:linear-gradient(270deg,rgba(0,0,0,0.1) 0%,transparent 100%)}
.ribbon-bookmark{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:36px;height:44px;z-index:8;
  background:linear-gradient(135deg,var(--coral),#a8563c);border-radius:0 0 3px 3px;box-shadow:0 2px 5px rgba(0,0,0,0.25)}
.ribbon-bookmark::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:18px;height:10px;
  background:var(--coral);clip-path:polygon(0 0,100% 0,50% 100%)}
.ribbon-bookmark::after{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:7px;height:18px;
  background:rgba(201,121,91,0.5);border-radius:2px}
.page-set{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;transition:opacity 0.3s ease;opacity:0;pointer-events:none}
.page-set.active{pointer-events:auto;opacity:1}
.page-set.hidden{opacity:0;pointer-events:none}
.page-slot{position:absolute;top:0;left:0;height:100%;width:50%;transform-style:preserve-3d}
.page-face{position:absolute;top:0;left:0;right:0;bottom:0;backface-visibility:hidden;overflow:hidden;position:relative}
.page-front{background:var(--paper-light);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 1.75rem,rgba(32,35,31,0.055) 1.78rem,transparent 1.8rem),
  radial-gradient(ellipse at 15% 85%,rgba(248,233,168,0.35) 0%,transparent 45%),
  radial-gradient(ellipse at 85% 15%,rgba(248,233,168,0.25) 0%,transparent 35%);
  border-radius:0 3px 3px 0;box-shadow:inset 0 0 0 1px var(--line)}
.page-back{background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 1.7rem,rgba(32,35,31,0.065) 1.73rem,transparent 1.76rem),
  radial-gradient(ellipse at 15% 85%,rgba(238,229,212,0.4) 0%,transparent 45%);
  border-radius:3px 0 0 3px;box-shadow:inset 0 0 0 1px var(--line);transform:rotateY(180deg)}
.page-back::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(37,37,31,0.07) 0.8px,transparent 0.8px);background-size:11px 11px;opacity:0.4}
.page-slot.right-slot{left:50%}
.page-slot.left-slot{transform:translateX(-100%)}
.page-slot.right-slot .page-front{border-radius:0 3px 3px 0}
.page-slot.left-slot .page-face,.page-slot.left-slot .page-front,.page-slot.left-slot .page-back{border-radius:3px 0 0 3px}
.page-slot.right-slot .page-face{border-radius:0 3px 3px 0}
.fold-corner{position:absolute;bottom:2px;z-index:12;width:40px;height:40px;cursor:pointer;pointer-events:auto;opacity:0;transition:opacity 0.2s}
.fold-corner.visible{opacity:1}
.fold-corner.right-corner{right:0}
.fold-corner.left-corner{left:0}
.fold-corner.right-corner .fold-tri{position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;
  border-width:0 0 40px 40px;border-color:transparent transparent var(--ink) transparent;opacity:0.65;
  filter:drop-shadow(-1px 2px 2px rgba(0,0,0,0.2));transition:opacity 0.15s}
.fold-corner.right-corner:hover .fold-tri{opacity:0.95}
.fold-corner.left-corner .fold-tri{position:absolute;bottom:0;left:0;width:0;height:0;border-style:solid;
  border-width:40px 0 0 40px;border-color:transparent transparent transparent var(--ink);opacity:0.65;
  filter:drop-shadow(1px 2px 2px rgba(0,0,0,0.2));transition:opacity 0.15s}
.fold-corner.left-corner:hover .fold-tri{opacity:0.95}
.fold-corner .fold-dot{position:absolute;bottom:7px;right:7px;width:12px;height:12px;
  border:1.5px solid rgba(255,255,255,0.5);border-radius:2px;transform:rotate(45deg)}
.fold-corner.left-corner .fold-dot{right:auto;left:7px}
.controls{display:flex;align-items:center;gap:12px;margin-top:2px}
.controls button{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  border:1px solid var(--ink);background:var(--paper-light);color:var(--ink);
  font-family:var(--font-sans);font-size:0.72rem;font-weight:600;cursor:pointer;
  transition:all 0.2s;border-radius:2px;user-select:none}
.controls button:hover:not(:disabled){background:var(--coral);color:var(--paper-light);border-color:var(--coral)}
.controls button:active:not(:disabled){transform:translate(2px,2px)}
.controls button:disabled{opacity:0.3;cursor:default}
.controls .page-counter{font-family:var(--font-hand);font-size:0.85rem;color:var(--muted);min-width:60px;text-align:center}
.tape{position:absolute;z-index:8;pointer-events:none;border:1px solid rgba(37,37,31,0.15);
  border-radius:2px 5px 3px 4px;opacity:0.85;background:rgba(245,216,137,0.85);box-shadow:1px 1px 2px rgba(0,0,0,0.1)}
.tape-striped{background:repeating-linear-gradient(90deg,rgba(245,216,137,0.9) 0px,rgba(245,216,137,0.9) 4px,transparent 4px,transparent 8px)}
.tape-dotted{background:radial-gradient(circle,rgba(245,216,137,0.9) 1px,transparent 1px);background-size:6px 6px}
.tape-plain{background:rgba(245,216,137,0.85)}
.polaroid{position:relative;background:var(--paper-light);padding:6px 6px 8px;
  border:1px solid var(--line);box-shadow:3px 4px 0 rgba(37,37,31,0.12),5px 6px 10px rgba(37,37,31,0.08)}
.polaroid img{display:block;width:100%;filter:saturate(0.75) contrast(1.04);border-radius:1px}
.project-meta{font-size:0.58rem;color:var(--muted);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.project-number{color:var(--coral)}
.project-title{font-family:var(--font-serif);font-size:1.15rem;font-weight:700;letter-spacing:-0.03em;line-height:1.1;margin:4px 0 5px;color:var(--ink)}
.project-desc{font-size:0.68rem;color:var(--muted);line-height:1.5;margin-bottom:7px}
.tech-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tech-tag{padding:2px 7px;border:1px solid var(--ink);font-size:0.55rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink);background:var(--sage);font-family:var(--font-sans)}
.repo-link{display:inline-flex;align-items:center;gap:5px;font-size:0.65rem;font-weight:700;color:var(--coral);border-bottom:1px solid var(--coral);text-decoration:none;transition:gap 0.2s}
.repo-link:hover{gap:8px}
.sticker{position:absolute;z-index:7;display:grid;place-items:center;border:1.5px solid var(--ink);
  border-radius:48% 52% 45% 55%/52% 45% 55% 48%;box-shadow:2px 3px 0 var(--ink);
  font-family:var(--font-hand);font-weight:700;font-size:0.7rem;line-height:0.9;text-align:center;color:var(--ink)}
.sticker-butter{background:var(--butter)}
.sticker-coral{background:var(--coral);color:var(--paper)}
.sticker-sage{background:var(--sage)}
.ink-stamp{position:absolute;z-index:7;border:1.5px solid var(--ink);padding:3px 8px;
  font-family:var(--font-hand);font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink);
  transform:rotate(-3deg);box-shadow:2px 2px 0 var(--ink);background:rgba(248,233,168,0.55)}
.note-text{font-family:var(--font-hand);font-size:0.9rem;line-height:1.55;color:var(--ink);transform:rotate(-1deg)}
.note-label{font-family:var(--font-mono);font-size:0.55rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral);margin-bottom:6px;display:block}
.index-list{list-style:none;padding:0}
.index-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:0.75rem}
.index-item:last-child{border-bottom:none}
.index-num{font-family:var(--font-mono);font-size:0.6rem;font-weight:700;color:var(--coral);min-width:22px}
.signoff-text{font-family:var(--font-hand);font-size:1rem;color:var(--ink);text-align:center;transform:rotate(-1deg);line-height:1.6}
.wrapper-text{font-family:var(--font-hand);font-size:0.75rem;color:var(--green);transform:rotate(-1deg);line-height:1.5;margin-top:6px}
.pagenum-stamp{position:absolute;top:8px;left:8px;z-index:7;font-family:var(--font-mono);font-size:0.5rem;font-weight:700;color:var(--muted);letter-spacing:0.05em;opacity:0.45}
@media(max-width:480px){.book-wrapper{width:95vw}.project-title{font-size:1rem}}
</style>
</head>
<body>
<div class="scrapbook-page">
  <h1>Things I&rsquo;ve <em>Made</em></h1>
  <p class="subtitle">a scrapbook journey</p>
  <div class="book-wrapper">
    <div class="book" id="book">
      <div class="spine"></div>
      <div class="spine-shadow-left"></div>
      <div class="spine-shadow-right"></div>
      <div class="ribbon-bookmark"></div>
    </div>
  </div>
  <div class="controls">
    <button id="prevBtn" aria-label="Previous page">&larr; Back</button>
    <span class="page-counter" id="pageCounter">1 / 3</span>
    <button id="nextBtn" aria-label="Next page">Next &rarr;</button>
  </div>
</div>

<script>
const projects=[
  {id:"kala-bazzar",title:"KalaBazzar Nepal",folderLabel:"Artisan Marketplace",
    desc:"A multi-vendor marketplace connecting Nepali artisans with customers across Nepal, with product discovery, seller management, orders, reviews, and online payments.",
    tags:["React","TypeScript","Node.js","MongoDB"],
    github:"https://github.com/Reetu-Dhakal/KalaBazzar",color:"#9bae87"},
  {id:"hamro-menu",title:"HamroMenu",folderLabel:"Digital Restaurant",
    desc:"Digital menu and QR ordering platform for restaurants, with menu management, table ordering, kitchen workflow, restaurant management, and analytics.",
    tags:["React","Node.js","Express","MongoDB"],
    github:"https://github.com/Reetu-Dhakal/Hamro_Menu",color:"#c9795b"}
];

const spreads=[
  {left:{type:'index'},right:{type:'project',idx:0}},
  {left:{type:'notes',idx:0},right:{type:'project',idx:1}},
  {left:{type:'signoff'},right:{type:'signoff'}}
];
const totalSpreads=spreads.length;
let currentSpread=0;
const bookEl=document.getElementById('book');
const pageCounter=document.getElementById('pageCounter');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const allSlots=[];

function svgForProject(idx){
  const p=projects[idx],c=p.color,W=300,H=185;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:100%;border-radius:1px;">
    <defs><linearGradient id="bg${idx}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:${c}0.12"/><stop offset="100%" style="stop-color:#f0e6d6"/></linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#bg${idx})"/>
    <rect x="0" y="0" width="${W}" height="22" fill="${c}" opacity="0.12"/>
    <circle cx="10" cy="11" r="3.5" fill="${c}" opacity="0.35"/><circle cx="19" cy="11" r="3.5" fill="${c}" opacity="0.22"/><circle cx="28" cy="11" r="3.5" fill="${c}" opacity="0.1"/>
    <rect x="14" y="42" width="50" height="7" rx="2" fill="${c}" opacity="0.25"/>
    <rect x="14" y="56" width="180" height="5" rx="1" fill="${c}" opacity="0.1"/>
    <rect x="14" y="66" width="140" height="5" rx="1" fill="${c}" opacity="0.08"/>
    <rect x="14" y="76" width="160" height="5" rx="1" fill="${c}" opacity="0.06"/>
    <rect x="14" y="95" width="70" height="35" rx="4" fill="${c}" opacity="0.15"/>
    <rect x="90" y="95" width="70" height="35" rx="4" fill="${c}" opacity="0.1"/>
    <rect x="14" y="145" width="270" height="22" rx="3" fill="${c}" opacity="0.2"/>
    <rect x="18" y="150" width="110" height="5" rx="2" fill="${c}" opacity="0.15"/>
    <text x="${W/2}" y="${H-10}" text-anchor="middle" font-family="cursive" font-size="10" fill="${c}" opacity="0.45">${p.title}</text>
  </svg>`;
}

function renderContent(page,isFront){
  if(page.type==='project'){
    const p=projects[page.idx];
    if(isFront){
      const tags=p.tags.map(t=>`<span class="tech-tag">${t}</span>`).join('');
      return `<div style="position:relative;height:100%;padding:0;"><span class="pagenum-stamp">0${page.idx+1}</span>
        <div class="tape tape-plain" style="top:0;left:10%;width:4.5rem;height:0.85rem;transform:rotate(-3deg);"></div>
        <div class="tape tape-dotted" style="bottom:22%;right:6%;width:3rem;height:0.7rem;transform:rotate(6deg);"></div>
        <div style="padding:12px 14px 6px;">
          <div class="project-meta"><span class="project-number">0${page.idx+1}</span> &middot; ${p.folderLabel}</div>
          <h3 class="project-title">${p.title}</h3>
          <p class="project-desc">${p.desc.substring(0,75)}&hellip;</p>
          <div class="tech-tags">${tags}</div>
          <a href="${p.github}" class="repo-link" target="_blank" rel="noopener" onclick="event.stopPropagation()">Browse repo &rarr;</a>
        </div>
        <div style="flex:1;display:flex;align-items:flex-end;justify-content:center;padding:2px 10px 6px;">
          <div class="polaroid" style="width:88%;">${svgForProject(page.idx)}<figcaption style="text-align:center;font-family:var(--font-mono);font-size:0.5rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:4px;">project screenshot</figcaption></div>
        </div>
        <div class="sticker sticker-butter" style="bottom:8px;right:10px;width:44px;height:44px;font-size:0.6rem;">${p.tags[0]}</div>
        <div class="ink-stamp" style="top:6px;left:6px;">${p.folderLabel}</div>
      </div>`;
    }
    const note=page.idx===0?'The creative process behind KalaBazzar was deeply inspiring. Connecting artisans with their market felt meaningful &mdash; every feature told a story of community and craft.':'HamroMenu was about solving a real problem. Restaurants needed a simple way to go digital without complexity. The QR-first approach made onboarding effortless.';
    return `<div style="position:relative;height:100%;padding:12px 14px;display:flex;flex-direction:column;"><span class="note-label">REFLECTION</span>
      <p class="note-text">${note}</p>
      <div class="tape tape-striped" style="top:10px;left:-2px;width:2.8rem;height:0.65rem;transform:rotate(-5deg);"></div>
      <div class="sticker sticker-sage" style="bottom:8px;left:8px;width:40px;height:40px;font-size:0.55rem;">${p.tags[0]}</div>
      <div class="wrapper-text">project 0${page.idx+1}</div>
    </div>`;
  }
  if(page.type==='index'){
    if(isFront){
      const items=projects.map((p,i)=>`<li class="index-item"><span class="index-num">0${i+1}</span><span><strong>${p.title}</strong><br><span style="font-size:0.6rem;color:var(--muted)">${p.folderLabel}</span></span></li>`).join('');
      return `<div style="position:relative;height:100%;padding:12px 14px;display:flex;flex-direction:column;"><span class="note-label">INDEX</span>
        <h2 style="font-family:var(--font-serif);font-size:1.1rem;font-weight:700;letter-spacing:-0.03em;margin-bottom:8px;">Things I&rsquo;ve Made</h2>
        <ul class="index-list">${items}</ul>
        <div class="tape tape-striped" style="top:10px;left:-2px;width:2.8rem;height:0.65rem;transform:rotate(4deg);"></div>
        <div class="wrapper-text">click the folded corner to explore &rarr;</div>
      </div>`;
    }
    return `<div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">
      <div class="sticker sticker-butter" style="width:56px;height:56px;font-size:0.7rem;">made with<br>curiosity</div>
      <div class="wrapper-text" style="margin-top:10px;">keep creating</div>
    </div>`;
  }
  if(page.type==='signoff'){
    if(isFront){
      return `<div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">
        <div class="signoff-text">the journey continues<br><br><span style="font-family:var(--font-hand);font-size:1.15rem;color:var(--coral);">&rarr; next adventure</span></div>
        <div class="sticker sticker-coral" style="width:46px;height:46px;margin-top:14px;font-size:0.75rem;">&#9733;</div>
        <div class="wrapper-text">made with curiosity</div>
      </div>`;
    }
    return `<div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;">
      <div class="wrapper-text">This scrapbook was created as a digital artifact.<br>All projects are real and open-source.<br><br>See them on GitHub.</div>
      <a href="https://github.com/Reetu-Dhakal?tab=repositories" class="repo-link" target="_blank" rel="noopener" style="margin-top:12px;" onclick="event.stopPropagation()">View all repos &rarr;</a>
    </div>`;
  }
  return '';
}

function createPageSet(spreadIdx){
  const spread=spreads[spreadIdx];
  const set=document.createElement('div');
  set.className='page-set';
  set.dataset.spread=spreadIdx;

  // Left page slot
  const lSlot=document.createElement('div');lSlot.className='page-slot left-slot';
  const lFront=document.createElement('div');lFront.className='page-face page-front';
  const lBack=document.createElement('div');lBack.className='page-face page-back';
  lFront.innerHTML=renderContent(spread.left,true);
  lBack.innerHTML=renderContent(spread.left,false);
  lSlot.appendChild(lFront);lSlot.appendChild(lBack);

  // Right page slot
  const rSlot=document.createElement('div');rSlot.className='page-slot right-slot';
  const rFront=document.createElement('div');rFront.className='page-face page-front';
  const rBack=document.createElement('div');rBack.className='page-face page-back';
  rFront.innerHTML=renderContent(spread.right,true);
  rBack.innerHTML=renderContent(spread.right,false);
  rSlot.appendChild(rFront);rSlot.appendChild(rBack);

  // Fold corner on right page front
  const rFold=document.createElement('div');rFold.className='fold-corner right-corner';
  rFold.innerHTML='<div class="fold-tri"></div><div class="fold-dot"></div>';
  rFold.addEventListener('click',()=>flipRight(spreadIdx));
  rFront.appendChild(rFold);

  // Fold corner on left page front (visible when there's a previous spread)
  const lFold=document.createElement('div');lFold.className='fold-corner left-corner';
  lFold.innerHTML='<div class="fold-tri"></div><div class="fold-dot"></div>';
  lFold.addEventListener('click',()=>flipLeft(spreadIdx));
  lFront.appendChild(lFold);

  // Fold corner on right page back (visible when right page is flipped)
  const rFoldBack=document.createElement('div');rFoldBack.className='fold-corner left-corner';
  rFoldBack.innerHTML='<div class="fold-tri"></div><div class="fold-dot"></div>';
  rFoldBack.addEventListener('click',()=>flipLeft(spreadIdx));
  rBack.appendChild(rFoldBack);

  set.appendChild(lSlot);set.appendChild(rSlot);
  bookEl.appendChild(set);
  allSlots.push({set,lSlot,rSlot});
}

function initAll(){
  spreads.forEach((_,i)=>createPageSet(i));
  showSpread(0);
}

function showSpread(idx){
  allSlots.forEach((s,i)=>{
    const isActive=i===idx;
    if(isActive){
      s.set.classList.remove('hidden');
      s.set.offsetHeight;
      s.set.classList.add('active');
      s.set.style.zIndex='1';
      s.lSlot.style.zIndex='2';
      s.rSlot.style.zIndex='3';
      s.rSlot.style.transition='';
      s.rSlot.style.transform='';
      const rFold=s.rSlot.querySelector('.fold-corner.right-corner');
      const lFold=s.lSlot.querySelector('.fold-corner.left-corner');
      if(rFold)rFold.classList.toggle('visible',idx<totalSpreads-1);
      if(lFold)lFold.classList.toggle('visible',idx>0);
      if(rFold)rFold.style.zIndex='15';
      if(lFold)lFold.style.zIndex='15';
    } else {
      s.set.classList.add('hidden');
      s.set.classList.remove('active');
      s.set.style.zIndex='0';
    }
  });
  updateControls();
}

function flipRight(spreadIdx){
  if(spreadIdx!==currentSpread)return;
  const slot=allSlots.find(s=>parseInt(s.set.dataset.spread)===spreadIdx);
  if(!slot)return;
  const rSlot=slot.rSlot;
  rSlot.style.transition='transform 0.65s cubic-bezier(0.645,0.045,0.355,1)';
  rSlot.style.transform='rotateY(-170deg)';
  setTimeout(()=>{
    currentSpread++;
    if(currentSpread>=totalSpreads)return;
    showSpread(currentSpread);
  },360);
}

function flipLeft(spreadIdx){
  if(spreadIdx!==currentSpread)return;
  currentSpread--;
  if(currentSpread<0)currentSpread=0;
  showSpread(currentSpread);
}

function goToSpread(idx){
  if(idx<0||idx>=totalSpreads||idx===currentSpread)return;
  currentSpread=idx;
  showSpread(currentSpread);
}

function updateControls(){
  pageCounter.textContent=`${currentSpread+1} / ${totalSpreads}`;
  prevBtn.disabled=currentSpread===0;
  nextBtn.disabled=currentSpread>=totalSpreads-1;
}

prevBtn.addEventListener('click',()=>{if(currentSpread>0)goToSpread(currentSpread-1);});
nextBtn.addEventListener('click',()=>{if(currentSpread<totalSpreads-1)goToSpread(currentSpread+1);});
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft')prevBtn.click();
  if(e.key==='ArrowRight')nextBtn.click();
});

initAll();
</script>
</body>
</html>
